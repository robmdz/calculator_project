<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="total_area">
    <h1>Calculator</h1>
    <div id="calculator_style">
    <div id="result_area"></div>
    <div id="buttons_area">
    <div id="operation_buttons_area">
       <button>Sum</button>
        <button>Rest</button>
        <button>Multi</button>
        <button>Div</button>
    </div>
    <div id="trigonometry_buttons_area">
        <button>Sin</button>
        <button>Cos</button>
        <button>Tan</button>
        <button>sin^-1</button>
        <button>Cos^-1</button>
        <button>Tan^-1</button>
    </div>
    <div id="other_buttons">
        <div id="logarithms_buttons_area">
            <button>Log</button>
            <button>Ln</button>
        </div>
        <div id="powers_roots_buttons_area">
            <button>x^y</button>
            <button>sqrt[y]{x}</button>
        </div>
        <div id="constants_buttons_area">
            <button>pi</button>
            <button>e</button>
        </div>
    </div>
    <div id="number_buttons_area">
        <div id="number_buttons_area_one">
            <button>1</button>
            <button>2</button>
            <button>3</button> 
        </div>
        <div id="number_buttons_area_two">
            <button>4</button>
            <button>5</button>
            <button>6</button>  
        </div>
        <div id="number_buttons_area_three">
            <button>7</button>
            <button>8</button>
            <button>9</button>   
        </div>
        <button>0</button>
    </div>
    </div>

    <button id="calculate_button">Calculate</button>
    </div>
    </div>
<script src="code.js"></script>
</body>
</html>
