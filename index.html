<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="total_area">
    <h1>Calculator</h1>
    <div id="calculator_style">
    <div id="output_area">
        <div id="input_area"></div>
        <div id="result_area"></div>
    </div>
    <div id="buttons_area">
    <div id="operation_buttons_area">
       <button id="sum">Sum</button>
        <button id="rest">Rest</button>
        <button id="multi">Multi</button>
        <button id="div">Div</button>
    </div>
    <div id="trigonometry_buttons_area">
        <button id="sin">Sin</button>
        <button id="cos">Cos</button>
        <button id="tan">Tan</button>
        <button id="n_sin">sin^-1</button>
        <button id="n_cos">Cos^-1</button>
        <button id="n_tan">Tan^-1</button>
    </div>
    <div id="other_buttons">
        <div id="logarithms_buttons_area">
            <button id="log">Log</button>
            <button id="ln">Ln</button>
        </div>
        <div id="powers_roots_buttons_area">
            <button id="powers">x^y</button>
            <button id="roots">sqrt[y]{x}</button>
        </div>
        <div id="constants_buttons_area">
            <button id="pi">pi</button>
            <button id="e">e</button>
        </div>
    </div>
    <div id="number_buttons_area">
        <div id="number_buttons_area_one">
            <button id="1">1</button>
            <button id="2">2</button>
            <button id="3">3</button> 
        </div>
        <div id="number_buttons_area_two">
            <button id="4">4</button>
            <button id="5">5</button>
            <button id="6">6</button>  
        </div>
        <div id="number_buttons_area_three">
            <button id="7">7</button>
            <button id="8">8</button>
            <button id="9">9</button>   
        </div>
        <button id="0">0</button>
    </div>
    </div>

    <button id="calculate_button">Calculate</button>
    </div>
    </div>
<script src="code.js"></script>
</body>
</html>
